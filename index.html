<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebEyeTrack demo</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5d6672; --accent:#1f6feb; --dot:#e5484d; --panel:#fff; --line:#d5d9df; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --fg:#e8eaed; --muted:#9aa3ae; --accent:#58a6ff; --dot:#ff6369; --panel:#1d2227; --line:#30363d; }
  }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p { margin:0 0 12px; color:var(--muted); }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
  button { font:inherit; padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  video { width:240px; border-radius:6px; border:1px solid var(--line); background:#000; transform:scaleX(-1); }
  #gaze { position:fixed; left:0; top:0; width:28px; height:28px; margin:-14px 0 0 -14px; border-radius:50%;
          background:var(--dot); opacity:.55; pointer-events:none; display:none; z-index:5; }
  #calib { position:fixed; inset:0; background:var(--bg); display:none; z-index:10; }
  #target { position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:var(--accent); }
  #calibMsg { position:absolute; left:0; right:0; bottom:24px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>WebEyeTrack demo</h1>
  <p>Gaze estimation runs locally in your browser.</p>
  <video id="video" autoplay playsinline muted></video>
  <div class="row">
    <button id="startBtn" class="primary">Start tracking</button>
    <button id="calibBtn" disabled>Calibrate</button>
    <button id="resetBtn" disabled>Reset calibration</button>
  </div>
  <div id="status" role="status" aria-live="polite">Click “Start tracking”.</div>
</main>
<div id="gaze"></div>
<div id="calib"><div id="target"></div><div id="calibMsg">Look at the dot and keep your head fairly still.</div></div>
<script type="module" src="/main.js"></script>
</body>
</html>
